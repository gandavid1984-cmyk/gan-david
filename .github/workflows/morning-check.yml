# בדיקת בוקר: אם משהו חסר באתר (ידיעות היום / תרגומים / הקלטות) או שריצת העיבוד האחרונה נכשלה —
# נפתח Issue במאגר. בעלת המאגר מקבלת על כך מייל והתראה באפליקציית GitHub.
# רץ ב-04:00 שעון ישראל (בקיץ ובחורף — שתי שעות UTC, ושלב ראשון מדלג על זו שאינה 04:00); אפשר גם להריץ ידנית.
name: morning-check
on:
  schedule:
    - cron: "0 1 * * *"    # 04:00 בשעון קיץ
    - cron: "0 2 * * *"    # 04:00 בשעון חורף
  workflow_dispatch:
    inputs:
      force_issue:
        description: "פתח Issue בדיקה גם אם הכול תקין (לבדיקת ההתראה)"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only at 04:00 Israel time
        id: gate
        run: |
          H=$(TZ=Asia/Jerusalem date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "04" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - name: Check
        id: check
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 tools/morning_check.py
      - name: Open issue on problems
        if: steps.gate.outputs.go == 'true' && (steps.check.outcome == 'failure' || inputs.force_issue == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f morning_report.md ] || echo "- בדיקת התראה ידנית: הכול תקין, זה רק מבחן." > morning_report.md
          TITLE="⚠️ עיתון גן דוד — בעיה בבוקר $(TZ=Asia/Jerusalem date +%d.%m.%Y)"
          # לא פותחים כפילות: אם כבר יש Issue פתוח באותו יום — מוסיפים לו הערה
          N=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          BODY="$(cat morning_report.md)

          הרצה: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
