# בדיקה זמנית בלבד — תימחק אחרי ההחלטה. לא נוגעת בידיעות.
name: gemini-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gemini_test.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
