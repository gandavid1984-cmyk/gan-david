# עיתון גן דוד — עיבוד אוטומטי אחרי כל עדכון ידיעות (בלי Claude, בלי טוקנים):
# ניקוי 30 יום, תרגום מוכן מראש (en/ru/es), קול קריין (Edge TTS), ו-commit חזרה.
name: postprocess
on:
  push:
    branches: [main]
    paths: ["data/news.json"]
  workflow_dispatch:
concurrency:
  group: postprocess
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts
      - name: Prune (30 days)
        run: python3 tools/prune.py 30
      - name: Translate (en/ru/es, easy/medium/hard)
        run: python3 tools/translate.py --days 30 --langs en,ru,es --levels easy,medium,hard || true
      - name: Audio (Edge TTS, easy/medium/hard)
        run: python3 tools/make_audio.py --days 30 --levels easy,medium,hard --concurrency 3 || true
      - name: Commit & push
        run: |
          git config user.name "gan-david bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data audio
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "עיבוד אוטומטי: תרגום ושמע [skip ci]"
          git pull --rebase -q origin main || true
          git push origin HEAD:main
