# בדיקת חיבור מהירה ל-Gemini (דקה): מדפיסה לכל מודל אם הבקשה עברה, ואם לא — את קוד השגיאה וההודעה. לא נוגעת בידיעות.
name: gemini-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/translate.py --check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
