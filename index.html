.oldnote{background:#fff4d6;border:1px solid #f5b301;color:#5b4300;border-radius:10px;padding:8px 12px;margin:6px 0 10px;font-weight:700;font-size:.95em}

:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#dbeafe; --purple:#7c3aed; --purple-soft:#ede9fe;
  --green:#16a34a; --green-soft:#dcfce7; --gold:#f5b301; --gold-soft:#fef3c7; --red:#b91c1c;
  --radius:24px; --shadow:0 8px 24px rgba(15,23,42,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent-soft:#1e3a8a; --purple-soft:#3b2a6e; --green-soft:#14532d; --gold-soft:#5a4a0a;
    --shadow:0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
  --accent-soft:#1e3a8a; --purple-soft:#3b2a6e; --green-soft:#14532d; --gold-soft:#5a4a0a;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(24px,4vw,34px);font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.today{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);font-size:18px;font-weight:700;line-height:1.7}
.today .big{font-size:22px}
.today .lbl{color:var(--muted);font-weight:600}
.status{font-size:15px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow)}
.status.warn{color:var(--red);border-color:var(--red)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:18px;font-weight:800;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px;min-height:46px}
.chip:hover{transform:translateY(-1px);border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip .n{font-size:13px;opacity:.85;background:rgba(255,255,255,.25);border-radius:999px;padding:0 7px}
.chip.on .n{background:rgba(255,255,255,.3)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.lvl{display:flex;gap:8px;flex-wrap:wrap}
.lvl button{flex:1;min-width:120px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:12px 14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:.18s;min-height:52px}
.lvl button:hover{transform:translateY(-1px)}
.lvl button[data-l="easy"].on{background:var(--green-soft);border-color:var(--green)}
.lvl button[data-l="medium"].on{background:var(--gold-soft);border-color:var(--gold)}
.lvl button[data-l="hard"].on{background:var(--purple-soft);border-color:var(--purple)}
.lvl button[data-l="expert"].on{background:var(--accent-soft);border-color:var(--accent)}
.bold-text article.item .body{font-weight:700}
select,.btn{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--card);color:var(--ink);cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn:hover{transform:translateY(-1px)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.count{color:var(--muted);font-size:15px}
article.item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px;border-top:6px solid var(--accent)}
article.item .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:6px}
article.item .tag{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
article.item h3{font-size:clamp(20px,3vw,26px);font-weight:800;margin:4px 0 10px;line-height:1.3}
article.item .body{font-size:19px;line-height:1.85;white-space:pre-line}
article.item .body.easy{font-size:21px;line-height:1.95}
article.item .body.hard{font-size:18px;line-height:1.75}
article.item .body.expert{font-size:17px;line-height:1.7}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
summary::before{content:"▸";transition:.15s}
details[open] summary::before{transform:rotate(90deg)}
ol.q{margin:8px 0 0;padding-inline-start:22px;font-size:18px}
ol.q li{margin-bottom:6px}
ul.src{margin:8px 0 0;padding-inline-start:20px;font-size:14px;color:var(--muted)}
ul.src a{color:var(--accent)}
.unverified{display:inline-block;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:18px}
.item .speak{display:inline-block;margin:6px 0 2px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink)}
.item .speak.on{background:var(--green-soft);border-color:var(--green)}
.fab{position:fixed;bottom:18px;left:16px;z-index:900;font:inherit;font-size:16px;font-weight:700;padding:12px 18px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#fff;box-shadow:var(--shadow);cursor:pointer}
.fab.unlock{left:auto;right:16px;background:#fff;color:var(--ink);border-color:var(--line)}
.fab[hidden]{display:none}
body.locked .card.no-print, body.locked .item .pick, body.locked .item .src-wrap{display:none!important}
body.locked header.top .sub{display:none}
.show[hidden]{display:none}
.show{position:fixed;inset:0;z-index:1000;background:#fffdf7;color:#111;display:flex;flex-direction:column;direction:rtl}
.show-bar,.show-nav{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;background:#f1efe6;border-bottom:1px solid #ddd}
.show-nav{border-top:1px solid #ddd;border-bottom:0}
.show-pos{font-weight:700;font-size:18px;color:#555;margin:0 8px}
.sbtn{font:inherit;font-size:18px;font-weight:700;padding:10px 18px;border-radius:999px;border:2px solid #bbb;background:#fff;cursor:pointer;color:#111}
.sbtn.big{font-size:22px;padding:14px 26px;background:var(--accent);color:#fff;border-color:var(--accent)}
.sbtn.big#showQ{background:#fff;color:#111;border-color:#bbb}
.sbtn.on{background:var(--green-soft);border-color:var(--green)}
.show-body{flex:1;overflow:auto;padding:24px 28px;font-size:var(--showfs,34px);line-height:1.7;font-weight:700}
.show-body .tag{display:inline-block;background:var(--accent-soft);border-radius:999px;padding:4px 16px;font-size:0.6em;margin-bottom:10px}
.show-body h2{font-size:1.25em;margin:0 0 16px;line-height:1.3}
.show-body .txt{white-space:pre-line}
.show-body ol{padding-inline-start:1.2em}
.show-body ol li{margin-bottom:0.5em}
.empty b{color:var(--ink);display:block;font-size:22px;margin-bottom:6px}
.item .pick{float:left;margin-inline-start:10px}
.item .pick input{width:22px;height:22px;cursor:pointer}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
.only-print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0;margin:0}
  header.top,.card,.tools,.foot,.no-print,details.src-wrap{display:none!important}
  .only-print{display:block}
  article.item{box-shadow:none;border:none;border-top:none;border-radius:0;padding:0 0 10mm;margin:0;page-break-after:always;page-break-inside:avoid}
  article.item:last-of-type{page-break-after:auto}
  article.item.hide-print{display:none!important}
  article.item .pick{display:none}
  article.item h3{font-size:26pt;margin:0 0 6mm}
  article.item .body{font-size:17pt;line-height:1.9}
  article.item .body.easy{font-size:19pt;line-height:2}
  article.item .body.hard{font-size:15.5pt;line-height:1.8}
  details{border-top:1px solid #999}
  details:not([open]){display:none}
  summary{color:#000}
  summary::before{content:""}
  ol.q{font-size:15pt}
  .print-head{font-size:12pt;color:#444;border-bottom:1px solid #999;padding-bottom:3mm;margin-bottom:6mm;display:flex;justify-content:space-between}
}
.goog-te-banner-frame,.skiptranslate iframe{display:none!important}
body{top:0!important}
#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
font{background:transparent!important;box-shadow:none!important}
.people{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:15px;color:#555}
.people .pbtn{display:inline-block;padding:6px 12px;border:1px solid #c9b48a;border-radius:999px;background:#fff8e8;color:#4a3a1a;text-decoration:none;font-size:15px}
.people .pbtn:hover{background:#f3e6c6}
.people .pgrp{display:inline-flex;gap:4px;align-items:center}
.people .pbtn.wiki{background:#eef3ff;border-color:#9fb4e8;color:#1e3a8a}
</style>

      <button class="btn primary" id="lock">🔒 נעילה — רק הידיעות שנבחרו</button>
      <button class="btn primary" id="present">📺 מצב הצגה לקבוצה</button>
      <button class="btn primary" id="pdf">📄 הורדת PDF להדפסה (A4)</button>
      <label for="fontSize" style="font-weight:700">גודל כתב:</label>
      <select id="fontSize" title="אוטומטי: כל ידיעה נכנסת בעמוד אחד, בכתב הגדול ביותר שאפשר. גודל קבוע: בדיוק הגודל שנבחר, וידיעה ארוכה תימשך לעמוד נוסף">
        <option value="auto" selected>אוטומטי — עמוד אחד לכל ידיעה</option>
        <option value="12">קטן (12)</option>
        <option value="14">רגיל (14)</option>
        <option value="17">גדול (17)</option>
        <option value="20">גדול מאוד (20)</option>
        <option value="24">ענק (24)</option>
        <option value="28">ענק במיוחד (28)</option>
      </select>
    </div>
  </section>
    <div id="pdfStage" style="position:absolute;left:-10000px;top:0;width:200mm;background:#fff;color:#000;direction:rtl"></div>

  <main id="list"></main>
  <button id="toTop" class="fab no-print" title="חזרה למעלה" translate="no" hidden>⬆ למעלה</button>
  <button id="unlock" class="fab unlock no-print" translate="no" hidden>🔓 ביטול נעילה</button>
  <div id="show" class="show" hidden translate="no">
    <div class="show-bar">
      <button class="sbtn" id="showClose">✕ סגור</button>
      <span class="show-pos" id="showPos"></span>
      <button class="sbtn" id="showSpeak">🔊 הקרא</button>
      <button class="sbtn" id="showSmaller">א−</button>
      <button class="sbtn" id="showBigger">א+</button>
    </div>
    <div class="show-body" id="showBody"></div>
    <div class="show-nav">
      <button class="sbtn big" id="showPrev">▶ הקודמת</button>
      <button class="sbtn big" id="showQ">❓ שאלות</button>
      <button class="sbtn big" id="showNext">הבאה ◀</button>
    </div>
  </div>
  <div class="foot" translate="no">הקטעים נכתבים מדי בוקר על סמך ידיעות שאומתו מול מקורות מוכרים. ידיעה שלא ניתן היה לאמת במלואה מסומנת.</div>
</div>

<script>
const TOPICS = [
  ["israel","חדשות מהארץ","🇮🇱"],
  ["world","חדשות מהעולם","🌍"],
  ["weather","מזג אוויר ועונות השנה","☀️"],
  ["holidays","חגים ומועדים","🕯️"],
  ["parasha","פרשת השבוע","📜"],
  ["nature","טבע וחיות","🌳"],
  ["economy","בורסה וכלכלה","📈"],
  ["transport","תחבורה","🚆"],
  ["health","בריאות ורפואה","🩺"],
  ["science","מדע וחלל","🔭"],
  ["tech","טכנולוגיה","📱"],
  ["sport","ספורט","⚽"],
  ["culture","תרבות ובידור","🎭"],
  ["food","אוכל וצרכנות","🍲"],
  ["community","קהילה ומעשים טובים","🤝"],
  ["history","היסטוריה וארכאולוגיה","🏺"],
  ["onthisday","היום בהיסטוריה — נוסטלגיה","🕰️"],
  ["birthdays","נולדו היום — אישים מפורסמים","🎂"],
];
const TOPIC_NAME = Object.fromEntries(TOPICS.map(t=>[t[0],t[1]]));
const TOPIC_EMOJI = Object.fromEntries(TOPICS.map(t=>[t[0],t[2]]));
const LEVEL_NAME = {easy:"פישוט קל",medium:"פישוט בינוני",hard:"פישוט גבוה",expert:"טקסט רגיל"};
const DATA_URL = "data/news.json";

const state = {bold:true, level:"easy", topics:new Set(), date:null, dates:[], all:[], items:[], picked:new Set(), range:"7"};
try{ const s=JSON.parse(localStorage.getItem("akt-prefs")||localStorage.getItem("akt-state")||"{}"); if(s.level) state.level=s.level; if(Array.isArray(s.topics)) state.topics=new Set(s.topics); if(s.fontSize) state.fontSize=String(s.fontSize); if(s.rate) state.rate=s.rate; }catch(e){}
function persist(){ /* ההעדפות נשמרות רק בלחיצה על "שמור את ההעדפות שלי" */ }
function savePrefs(){ try{ localStorage.setItem("akt-prefs",JSON.stringify({level:state.level,topics:[...state.topics],fontSize:$("#fontSize").value,rate:$("#rate").value})); return true; }catch(e){ return false; } }
function applyBold(){ document.body.classList.toggle("bold-text",state.bold); const c=document.getElementById("boldText"); if(c) c.checked=state.bold; }

const $ = s=>document.querySelector(s);
const statusEl=$("#status"), listEl=$("#list"), dateSel=$("#date"), topicsEl=$("#topics");

function heDate(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  const days=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const months=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  return `יום ${days[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
}
function gematria(n){
  n=Number(n); if(!n||n<1||n>999) return String(n);
  const H=[[400,"ת"],[300,"ש"],[200,"ר"],[100,"ק"],[90,"צ"],[80,"פ"],[70,"ע"],[60,"ס"],[50,"נ"],[40,"מ"],[30,"ל"],[20,"כ"],[10,"י"],[9,"ט"],[8,"ח"],[7,"ז"],[6,"ו"],[5,"ה"],[4,"ד"],[3,"ג"],[2,"ב"],[1,"א"]];
  let out="";
  for(const [v,l] of H){ while(n>=v){ if(n===15){ out+="טו"; n=0; break; } if(n===16){ out+="טז"; n=0; break; } out+=l; n-=v; } }
  return out.length>1 ? out.slice(0,-1)+"״"+out.slice(-1) : out+"׳";
}
function hebDate(d){
  try{
    const parts=new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d);
    const get=t=>(parts.find(x=>x.type===t)||{}).value||"";
    const day=parseInt(get("day"),10), year=parseInt(get("year"),10), month=get("month");
    if(!day||!year||!month) return "";
    return ` · ${gematria(day)} ב${month} ${gematria(year%1000)}`;
  }catch(e){ return ""; }
}
function todayIso(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---- levels / bold
$("#lvl").addEventListener("click",e=>{
  const b=e.target.closest("button[data-l]"); if(!b) return;
  state.level=b.dataset.l; persist(); renderLevel(); renderList();
});
function renderLevel(){ document.querySelectorAll("#lvl button").forEach(b=>b.classList.toggle("on",b.dataset.l===state.level)); }

// ---- topics
function topicLabel(id, it){ if(TOPIC_NAME[id]) return TOPIC_NAME[id]; if(String(id).startsWith("country:")) return (it&&it.country)||id.slice(8); return id; }
function topicEmoji(id){ return TOPIC_EMOJI[id] || (String(id).startsWith("country:")?"🌐":"📰"); }
function renderTopics(){
  const counts={}, extra={}; state.items.forEach(it=>{counts[it.topic]=(counts[it.topic]||0)+1; if(!TOPIC_NAME[it.topic]) extra[it.topic]=topicLabel(it.topic,it);});
  const chip=(id,name,em)=>`<button class="chip ${state.topics.has(id)?"on":""}" data-t="${esc(id)}">${em} ${esc(name)}${counts[id]?` <span class="n">${counts[id]}</span>`:""}</button>`;
  topicsEl.innerHTML = TOPICS.map(([id,name,em])=>chip(id,name,em)).join("")
    + Object.keys(extra).sort().map(id=>chip(id,extra[id],topicEmoji(id))).join("");
}
topicsEl.addEventListener("click",e=>{
  const b=e.target.closest("button[data-t]"); if(!b) return;
  const id=b.dataset.t; state.topics.has(id)?state.topics.delete(id):state.topics.add(id);
  persist(); renderTopics(); renderList();
});
$("#allTopics").onclick=()=>{ TOPICS.forEach(t=>state.topics.add(t[0])); state.items.forEach(it=>state.topics.add(it.topic)); persist(); renderTopics(); renderList(); };
$("#noTopics").onclick=()=>{ state.topics.clear(); persist(); renderTopics(); renderList(); };

// ---- countries (fixed list from the data file)
let countries=[];
function renderCountries(){
  if(!$("#countries")) return;
  $("#countries").innerHTML = countries.map(c=>`<span class="chip on" style="cursor:default">🌐 ${esc(c)}</span>`).join("") || `<span class="count">עדיין לא נבחרו מדינות.</span>`;
}

// ---- dates / period
dateSel.addEventListener("change",()=>{ state.date=dateSel.value; selectItems(); });
$("#range").addEventListener("change",()=>{ state.range=$("#range").value; dateSel.style.display = state.range==="day"? "" : "none"; selectItems(); });
function rangeFrom(){ if(state.range==="day") return state.date; const d=new Date(state.date+"T12:00:00"); d.setDate(d.getDate()-(Number(state.range)-1)); return d.toISOString().slice(0,10); }
function rangeLabel(){ return state.range==="day"? heDate(state.date) : `${heDate(rangeFrom())} – ${heDate(state.date)}`; }
function renderDates(){
  dateSel.innerHTML = state.dates.map(d=>`<option value="${d}" ${d===state.date?"selected":""}>${heDate(d)}${d===todayIso()?" (היום)":""}</option>`).join("");
  $("#dateNote").textContent = state.dates.length? "" : "עדיין אין ידיעות במערכת";
}
function selectItems(){
  state.picked.clear();
  if(!state.date){ state.items=[]; renderTopics(); renderList(); return; }
  const from=rangeFrom(), to=state.date;
  state.items = state.all.filter(it=>it.date>=from && it.date<=to);
  // פרשת השבוע: הידיעה האחרונה שנכתבה לפני התאריך הנבחר ושהשבת שלה עוד לא עברה — מוצגת גם אם נכתבה בתחילת השבוע
  if(!state.items.some(it=>it.topic==="parasha")){
    const p=state.all.filter(it=>it.topic==="parasha" && it.date<=to && (it.shabbat||it.date)>=from).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
    if(p) state.items=[...state.items,p];
  }
  // נושא בלי ידיעה בתקופה שנבחרה: מציגים את הידיעה האחרונה שנכתבה בו, עם הודעה ברורה בראשה
  const have=new Set(state.items.map(it=>it.topic));
  TOPICS.forEach(([id])=>{
    if(have.has(id)||id==="parasha") return;
    const last=state.all.filter(it=>it.topic===id && it.date<from).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
    if(last) state.items=[...state.items,{...last,_old:true}];
  });
  renderTopics(); renderList();
}

// ---- list
function shownText(it){
  const body = it[state.level]||(state.level==="expert"?it.hard:"")||it.medium||it.easy||"";
  return {title:it.title, body, questions:Array.isArray(it.questions)?it.questions:[], fallback: state.level==="expert"&&!it.expert};
}
function visibleItems(){
  const sel = state.topics.size? state.items.filter(it=>state.topics.has(it.topic)) : [];
  const order = Object.fromEntries(TOPICS.map((t,i)=>[t[0],i]));
  return sel.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)) || (order[a.topic]??99)-(order[b.topic]??99) || String(a.id).localeCompare(String(b.id)));
}
let renderList=function(){
  const items=visibleItems();
  $("#count").textContent = "";
  if(!state.items.length){
    listEl.innerHTML = `<div class="empty" translate="no"><b>אין עדיין ידיעות לתאריך הזה</b>הידיעות נכנסות למערכת כל בוקר. אם זה הבוקר של היום — אפשר לבדוק שוב בעוד כמה דקות.</div>`;
    return;
  }
  if(!items.length){
    listEl.innerHTML = state.topics.size
      ? `<div class="empty" translate="no"><b>אין ידיעות בנושאים שנבחרו</b>בחר נושאים אחרים למעלה.</div>`
      : `<div class="empty" translate="no"><b>עדיין לא נבחרו נושאים</b>בחר נושאים למעלה כדי לראות ידיעות, או "בחר הכול".</div>`;
    return;
  }
  listEl.innerHTML = items.map(it=>{
    const shown = shownText(it);
    const src = Array.isArray(it.sources)? it.sources : [];
    const checked = state.picked.has(it.id);
    return `<article class="item ${checked?"":"hide-print"}" data-id="${esc(it.id)}">
      <label class="pick no-print" title="לכלול בהדפסה" translate="no"><input type="checkbox" ${checked?"checked":""} data-pick="${esc(it.id)}"></label>
      <div class="meta no-print" translate="no"><span class="tag">${topicEmoji(it.topic)} ${esc(topicLabel(it.topic,it))}</span>${state.range!=="day"?`<span>${heDate(it.date)}</span>`:""}${it.verified===false?`<span class="unverified">לא אומת במלואו</span>`:""}${shown.fallback?`<span class="unverified">אין לידיעה זו טקסט רגיל — מוצג הפישוט הגבוה</span>`:""}</div>
      ${it._old?`<div class="oldnote" translate="no">כתבה זו נכתבה ב${heDate(it.date)}. אין כתבה חדשה בנושא הזה להיום.</div>`:""}
      <h3>${esc(shown.title)}</h3>
      <div class="body ${state.level}">${esc(shown.body)}</div>
      ${(!state.lang && Array.isArray(it.audio) && it.audio.includes(state.level))
        ? `<button class="speak no-print" data-play="${esc(it.id)}" data-src="audio/${esc(it.id)}-${state.level}.mp3" translate="no">▶ האזנה</button>`
        : `<button class="speak no-print" data-speak="${esc(it.id)}" translate="no">🔊 הקרא</button>`}
      ${shown.questions.length?`<details><summary translate="no">שאלות לשיחה עם הקבוצה</summary><ol class="q">${shown.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></details>`:""}
      ${Array.isArray(it.people)&&it.people.length?`<div class="people no-print" translate="no"><span>לכל אדם — תמונות ומידע בעברית (נפתח בחלון חדש):</span>${it.people.map(p=>`<span class="pgrp"><a class="pbtn" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p)}" target="_blank" rel="noopener">🖼️ ${esc(p)}</a><a class="pbtn wiki" href="https://he.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(p)}&go=Go" target="_blank" rel="noopener">📖 ויקיפדיה</a></span>`).join("")}</div>`:""}
      ${src.length?`<details class="src-wrap" translate="no"><summary>מקורות (למדריכה)</summary><ul class="src">${src.map(s=>`<li>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`:esc(s.title||"")}</li>`).join("")}</ul></details>`:""}
    </article>`;
  }).join("");
};
listEl.addEventListener("change",e=>{
  const c=e.target.closest("input[data-pick]"); if(!c) return;
  const id=c.dataset.pick; c.checked? state.picked.add(id) : state.picked.delete(id);
  c.closest("article").classList.toggle("hide-print",!c.checked);
});
function pickedItems(){ if(!state.picked.size){ visibleItems().forEach(it=>state.picked.add(it.id)); renderList(); } return visibleItems().filter(it=>state.picked.has(it.id)); }

// ---- PDF (A4, one item per page, page breaks between lines)
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
$("#pdf").onclick=async()=>{
  const btn=$("#pdf"); const items=pickedItems(); if(!items.length) return;
  btn.disabled=true; const old=btn.textContent; btn.textContent="מכין PDF…";
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    await document.fonts.ready;
    const stage=$("#pdfStage"); const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const A4_W=210, A4_H=297, M=8, PW=A4_W-2*M, PH=A4_H-2*M;
    for(let i=0;i<items.length;i++){
      const it=items[i]; let sh=shownText(it);
      const art=document.querySelector(`article.item[data-id="${CSS.escape(it.id)}"]`);
      const translated = art && art.dataset.translated===state.lang && state.lang;
      if(translated){ sh={title:art.querySelector("h3").textContent, body:art.querySelector(".body").textContent, questions:[...art.querySelectorAll("ol.q li")].map(l=>l.textContent)}; }
      const dir = translated? "ltr":"rtl";
      // גודל כתב: "auto" = הכי גדול שנכנס בעמוד אחד (מ-24 ומטה, עד 11). גודל מספרי = בדיוק הגודל שנבחר; ידיעה ארוכה תתפרס על יותר מעמוד אחד (חיתוך בין שורות).
      const chosen=$("#fontSize").value; const autoFit = chosen==="auto"; let fs = autoFit? 24 : (Number(chosen)||20);
      const build=(fs)=>{
        const qfs=Math.max(12,fs-3);
        const bodyLH = fs>=22? 1.7 : 1.85;
        stage.innerHTML=`<div style="width:${PW}mm;min-height:${PH}mm;padding:6mm 8mm;box-sizing:border-box;font-family:'Heebo',Arial,sans-serif;background:#fff;color:#000;direction:${dir};text-align:${dir==="rtl"?"right":"left"}">
        <div style="font-size:11pt;color:#555;border-bottom:1px solid #999;padding-bottom:2mm;margin-bottom:5mm;display:flex;justify-content:space-between;direction:rtl"><span>${esc(topicLabel(it.topic,it))} · ${LEVEL_NAME[state.level]}${translated?" · "+esc(LANG_NAME[state.lang]):""}</span><span>${heDate(it.date)}</span></div>
        <h1 style="font-size:${Math.round(fs*1.3)}pt;font-weight:800;margin:0 0 5mm;line-height:1.3">${esc(sh.title)}</h1>
        <div style="font-size:${fs}pt;line-height:${bodyLH};white-space:pre-line;font-weight:${state.bold?700:400}">${esc(sh.body)}</div>
        ${sh.questions.length?`<div style="margin-top:6mm;border-top:1px solid #999;padding-top:3mm"><div style="font-weight:800;font-size:${qfs}pt;margin-bottom:2mm">שאלות לשיחה</div>${sh.questions.map((q,k)=>`<div style="display:flex;gap:3mm;align-items:flex-start;font-size:${qfs}pt;line-height:1.6;margin-bottom:2mm;direction:${dir}"><span style="font-weight:800;flex:0 0 auto;min-width:1.4em">${k+1}.</span><span style="flex:1 1 auto">${esc(q)}</span></div>`).join("")}</div>`:""}
      </div>`;
        return stage.firstElementChild;
      };
      let root=build(fs);
      await new Promise(r=>setTimeout(r,60));
      let pxPerMm=root.getBoundingClientRect().width/PW;
      const overflows=()=>root.getBoundingClientRect().height > PH*pxPerMm + 1;
      while(autoFit && overflows() && fs>11){ fs = Math.round((fs-0.5)*2)/2; root=build(fs); pxPerMm=root.getBoundingClientRect().width/PW; }
      const top=root.getBoundingClientRect().top;
      const bottoms=new Set();
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      let n; while((n=walker.nextNode())){ if(!n.textContent.trim()) continue; const r=document.createRange(); r.selectNodeContents(n); for(const rc of r.getClientRects()) bottoms.add(Math.ceil((rc.bottom-top)/pxPerMm)); }
      const lines=[...bottoms].sort((a,b)=>a-b);
      const canvas=await html2canvas(root,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
      const img=canvas.toDataURL("image/jpeg",0.95);
      const w=PW, h=canvas.height/canvas.width*w;
      let offset=0, first=true;
      while(offset<h-1){
        if(i>0||!first) doc.addPage();
        let cut=offset+PH;
        if(cut<h){ const safe=lines.filter(b=>b<=cut-2&&b>offset+10); if(safe.length) cut=safe[safe.length-1]+1; }
        doc.addImage(img,"JPEG",M,M-offset,w,h);
        doc.setFillColor(255,255,255);
        doc.rect(0,0,A4_W,M,"F");
        doc.rect(0,M+(cut-offset),A4_W,A4_H-(M+(cut-offset)),"F");
        offset=cut; first=false;
      }
    }
    stage.innerHTML="";
    doc.save(`עיתון-גן-דוד-${state.date}-${LEVEL_NAME[state.level]}.pdf`);
  }catch(e){ console.error(e); $("#count").textContent="יצירת ה-PDF נכשלה: "+(e.message||e); }
  finally{ btn.disabled=false; btn.textContent=old; }
};

// ---- preferences (saved on this device, no name needed)
$("#savePrefs").onclick=()=>{
  if(!state.topics.size){ $("#prefsNote").textContent="בחר לפחות נושא אחד לפני השמירה."; return; }
  $("#prefsNote").textContent = savePrefs()? `ההעדפות נשמרו במכשיר הזה (${state.topics.size} נושאים, ${LEVEL_NAME[state.level]}, גודל כתב ${$("#fontSize").value}).` : "השמירה נכשלה במכשיר הזה.";
};

async function gtranslateOnce(text, lang){
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),20000);
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=iw&tl="+encodeURIComponent(lang)+"&dt=t&q="+encodeURIComponent(text),{signal:ctrl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); const out=(j[0]||[]).map(x=>x[0]).join("");
    if(!out) throw new Error("empty");
    return out;
  } finally { clearTimeout(timer); }
}
async function gtranslate(text, lang){
  const key=lang+"|"+text; if(trCache[key]) return trCache[key];
  // טקסט ארוך (רמה רגילה) נשלח בפסקאות, כדי לא לחרוג מאורך הבקשה
  if(text.length>1500 && text.includes("\n")){
    const parts=text.split("\n"); const outs=[];
    for(const p of parts){ outs.push(p.trim()? await gtranslate(p,lang) : ""); }
    const joined=outs.join("\n"); trCache[key]=joined; return joined;
  }
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{ const out=await gtranslateOnce(text,lang); trCache[key]=out; return out; }
    catch(e){ lastErr=e; await new Promise(r=>setTimeout(r, 800*Math.pow(2,attempt))); }
  }
  throw lastErr;
}

        const {t,b,qs}=res;
        const h3=art.querySelector("h3"), body=art.querySelector(".body"), lis=art.querySelectorAll("ol.q li");
        if(h3){ h3.textContent=t; h3.dir="ltr"; h3.style.textAlign="left"; }
        if(body){ body.textContent=b; body.dir="ltr"; body.style.textAlign="left"; }
        lis.forEach((li,i)=>{ if(qs[i]){ li.textContent=qs[i]; li.dir="ltr"; li.style.textAlign="left"; } });
        art.dataset.translated=lang; done++; failed--;
      }catch(e){}
    }
  }
  saveTrCache();
  note.textContent = failed? `${done} ידיעות תורגמו ל${LANG_NAME[lang]}; ${failed} לא הצליחו (שירות התרגום של Google לא ענה). אפשר לבחור שוב את השפה כדי לנסות שוב.` : `הידיעות מוצגות ב${LANG_NAME[lang]} — תרגום אוטומטי של Google. לחזרה לעברית: "עברית (המקור)".`;
}
$("#lang").value=state.lang;
$("#lang").addEventListener("change",()=>{ stopSpeak(); state.lang=$("#lang").value; try{ localStorage.setItem("akt-lang",state.lang); }catch(e){} renderList(); if(state.lang) translateVisible(); else $("#langNote").textContent=""; });
// re-translate whenever the list is re-rendered
const _renderList=renderList; renderList=function(){ _renderList(); if(state.lang) translateVisible(); };
if("serviceWorker" in navigator && location.protocol==="https:" ){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
